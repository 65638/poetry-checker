name: 基础检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    name: 基础检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node --test tests/desktop/preview-assets.test.mjs
