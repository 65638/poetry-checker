<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101f25" />
    <meta name="description" content="查读音、读诗文、看声律依据，在原诗语境中研读与推敲。" />
    <link rel="icon" type="image/svg+xml" href="/design/poetry-mark.svg" />
    <link rel="stylesheet" href="/design/entrance.css" />
    <title>月下听韵 · 诗格律检查器</title>

    <div id="root">
      <main class="pc-entrance" aria-labelledby="pc-entrance-title">

          <p class="pc-entrance__noscript">请在浏览器中启用 JavaScript 后重新打开，以使用查字、读诗和分析功能。</p>
          <style>.pc-entrance__status, .pc-entrance__help { display: none; }</style>

      </main>

    <script type="module" src="/src/main.tsx"></script>
